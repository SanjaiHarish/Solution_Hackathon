{% extends "base.html" %}
{% block content %}

<h3>Assigned Tasks</h3>

<table class="table table-bordered table-striped">
<thead class="table-dark">
<tr>
<th>S.No</th>
<th>Work Type</th>
<th>Name</th>
<th>Category</th>
<th>Date</th>
</tr>
</thead>

<tbody>
{% for a in assignments %}
<tr>
<td>{{ loop.index }}</td>
<td>{{ a[1] }}</td>
<td>{{ a[2] }}</td>
<td>{{ a[3] }}</td>
<td>{{ a[4] }}</td>
</tr>
{% endfor %}
</tbody>

</table>

{% endblock %}
